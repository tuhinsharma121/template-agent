[pytest]
# Pytest configuration for Deep Agents-style skill evaluation

testpaths = skills

# Markers for categorizing tests
markers =
    skill: tests with skill loaded
    baseline: tests without skill (baseline)
    slow: slow-running comparison tests

# Output formatting
console_output_style = progress
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
